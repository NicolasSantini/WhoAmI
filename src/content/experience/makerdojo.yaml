role: Formatore AI per docenti
company: MakerDojo
engagement: Freelance
start: 2026-10
summary: Incarico freelance, svolto in parallelo all'ingegneria, per un'organizzazione educativa che porta coding, robotica e AI nelle scuole.
sections:
  - points:
      - Ho progettato da zero, su richiesta del cliente, un percorso pratico di AI generativa (Google Gemini, NotebookLM) per i docenti di una rete di scuole pubbliche di Piacenza, poi rivisto sui vincoli della scuola dopo la prima revisione.
      - Ho adattato il percorso a quattro aree disciplinari e tre livelli scolastici, dall'infanzia alla secondaria di primo grado, in un programma da 38 sessioni per 19 gruppi di docenti, condiviso con un secondo formatore.
      - Tengo workshop in presenza da quattro ore in cui i docenti costruiscono e verificano materiali reali per la classe; ho prodotto guide per i formatori, slide e un framework di prompting in cinque parti, con regole di protezione dei dati dei minori in ogni sessione.
